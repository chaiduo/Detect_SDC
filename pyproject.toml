[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detect-sdc"
version = "0.1.0"
description = "Fault injection, feature extraction, and significant SDC detection pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
labeling = [
    "torch>=2.1",
    "transformers>=4.40",
    "tqdm>=4.66",
]
qwen = [
    "torch>=2.1",
    "transformers>=4.40",
    "qwen-vl-utils>=0.0.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
detect-sdc = "detect_sdc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
