name: vqav2
adapter: detect_sdc.adapters.datasets.vqav2.VQAv2Adapter
format: parquet_with_embedded_images

paths:
  parquet: /data01/cd_workspace/llm/VQAv2

sampling:
  max_samples: 5000
  deterministic_order: true

split:
  manifest: splits/vqav2_seed42.json
  group_column: semantic_group_id
  fit_ratio: 0.70
  calibration_ratio: 0.15
  test_ratio: 0.15
  seed: 42
