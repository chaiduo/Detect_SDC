schema_version: 2
name: current_significant_sdc_matrix

models:
  qwen25_vl: configs/models/qwen25_vl.yaml
  llava15: configs/models/llava15.yaml
  internvl3: configs/models/internvl3.yaml

datasets:
  earthvqa: configs/datasets/earthvqa.yaml
  lingoqa: configs/datasets/lingoqa.yaml
  vqav2: configs/datasets/vqav2.yaml

matrix:
  - [qwen25_vl, earthvqa]
  - [qwen25_vl, lingoqa]
  - [qwen25_vl, vqav2]
  - [llava15, earthvqa]
  - [llava15, lingoqa]
  - [llava15, vqav2]
  - [internvl3, earthvqa]
  - [internvl3, lingoqa]
  - [internvl3, vqav2]

pipeline:
  stages:
    - profile
    - collect_mapping
    - train_mapping
    - inject
    - label
    - featurize
    - train_detector
    - report

execution:
  jobs:
    qwen25_vl_earthvqa:
      model: qwen25_vl
      dataset: earthvqa
      profile_output: artifacts/iclr_v2/qwen25_vl_earthvqa/json/profile.json
      mapping_data: artifacts/iclr_v2/qwen25_vl_earthvqa/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/qwen25_vl_earthvqa/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/qwen25_vl_earthvqa/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/qwen25_vl_earthvqa/json/labels.jsonl
    qwen25_vl_lingoqa:
      model: qwen25_vl
      dataset: lingoqa
      instrumentation:
        projection_method: project
      profile_output: artifacts/iclr_v2/qwen25_vl_lingoqa/json/profile.json
      mapping_data: artifacts/iclr_v2/qwen25_vl_lingoqa/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/qwen25_vl_lingoqa/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/qwen25_vl_lingoqa/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/qwen25_vl_lingoqa/json/labels.jsonl
    qwen25_vl_vqav2:
      model: qwen25_vl
      dataset: vqav2
      profile_output: artifacts/iclr_v2/qwen25_vl_vqav2/json/profile.json
      mapping_data: artifacts/iclr_v2/qwen25_vl_vqav2/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/qwen25_vl_vqav2/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/qwen25_vl_vqav2/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/qwen25_vl_vqav2/json/labels.jsonl
    llava15_earthvqa:
      model: llava15
      dataset: earthvqa
      profile_output: artifacts/iclr_v2/llava15_earthvqa/json/profile.json
      mapping_data: artifacts/iclr_v2/llava15_earthvqa/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/llava15_earthvqa/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/llava15_earthvqa/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/llava15_earthvqa/json/labels.jsonl
    llava15_lingoqa:
      model: llava15
      dataset: lingoqa
      profile_output: artifacts/iclr_v2/llava15_lingoqa/json/profile.json
      mapping_data: artifacts/iclr_v2/llava15_lingoqa/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/llava15_lingoqa/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/llava15_lingoqa/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/llava15_lingoqa/json/labels.jsonl
    llava15_vqav2:
      model: llava15
      dataset: vqav2
      profile_output: artifacts/iclr_v2/llava15_vqav2/json/profile.json
      mapping_data: artifacts/iclr_v2/llava15_vqav2/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/llava15_vqav2/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/llava15_vqav2/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/llava15_vqav2/json/labels.jsonl
    internvl3_earthvqa:
      model: internvl3
      dataset: earthvqa
      profile_output: artifacts/iclr_v2/internvl3_earthvqa/json/profile.json
      mapping_data: artifacts/iclr_v2/internvl3_earthvqa/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/internvl3_earthvqa/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/internvl3_earthvqa/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/internvl3_earthvqa/json/labels.jsonl
    internvl3_lingoqa:
      model: internvl3
      dataset: lingoqa
      instrumentation:
        projection_method: project
      profile_output: artifacts/iclr_v2/internvl3_lingoqa/json/profile.json
      mapping_data: artifacts/iclr_v2/internvl3_lingoqa/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/internvl3_lingoqa/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/internvl3_lingoqa/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/internvl3_lingoqa/json/labels.jsonl
    internvl3_vqav2:
      model: internvl3
      dataset: vqav2
      profile_output: artifacts/iclr_v2/internvl3_vqav2/json/profile.json
      mapping_data: artifacts/iclr_v2/internvl3_vqav2/json/mapping.jsonl
      mapping_model: artifacts/iclr_v2/internvl3_vqav2/model/mapping_model.pt
      injected_output: artifacts/iclr_v2/internvl3_vqav2/json/injection.jsonl
      labeled_output: artifacts/iclr_v2/internvl3_vqav2/json/labels.jsonl

labeling:
  model_path: /data01/cd_workspace/llm/prometheus-7b-v2.0
  max_new_tokens: 200
  identical_answer_policy: skip_and_mark_correct
  quality_scale: [0, 1, 2]
  significance_scale: [2, 1, 0]

features:
  last_k_steps: 2
  step_window: prefix
  statistics: [mean, max, min]
  metrics: [cos_sim, mean_diff, std_diff, l2_distance]
  finite_only: true
  layer_pairs:
    - [6, 7]
    - [22, 23]
    - [23, 24]
    - [24, 25]
    - [25, 26]
    - [26, 27]
  distance_pairs:
    - [6, 7]
    - [22, 23]
    - [23, 24]
    - [24, 25]
    - [25, 26]
    - [26, 27]

featurization:
  jobs:
    qwen25_vl_earthvqa:
      model: qwen25_vl
      dataset: earthvqa
      input: artifacts/iclr_v2/qwen25_vl_earthvqa/json/labels.jsonl
      fit_output: artifacts/iclr_v2/qwen25_vl_earthvqa/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/qwen25_vl_earthvqa/train_data/calibration.csv
      test_output: artifacts/iclr_v2/qwen25_vl_earthvqa/train_data/test.csv
    qwen25_vl_lingoqa:
      model: qwen25_vl
      dataset: lingoqa
      input: artifacts/iclr_v2/qwen25_vl_lingoqa/json/labels.jsonl
      fit_output: artifacts/iclr_v2/qwen25_vl_lingoqa/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/qwen25_vl_lingoqa/train_data/calibration.csv
      test_output: artifacts/iclr_v2/qwen25_vl_lingoqa/train_data/test.csv
    qwen25_vl_vqav2:
      model: qwen25_vl
      dataset: vqav2
      input: artifacts/iclr_v2/qwen25_vl_vqav2/json/labels.jsonl
      fit_output: artifacts/iclr_v2/qwen25_vl_vqav2/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/qwen25_vl_vqav2/train_data/calibration.csv
      test_output: artifacts/iclr_v2/qwen25_vl_vqav2/train_data/test.csv
    llava15_earthvqa:
      model: llava15
      dataset: earthvqa
      input: artifacts/iclr_v2/llava15_earthvqa/json/labels.jsonl
      fit_output: artifacts/iclr_v2/llava15_earthvqa/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/llava15_earthvqa/train_data/calibration.csv
      test_output: artifacts/iclr_v2/llava15_earthvqa/train_data/test.csv
    llava15_lingoqa:
      model: llava15
      dataset: lingoqa
      input: artifacts/iclr_v2/llava15_lingoqa/json/labels.jsonl
      fit_output: artifacts/iclr_v2/llava15_lingoqa/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/llava15_lingoqa/train_data/calibration.csv
      test_output: artifacts/iclr_v2/llava15_lingoqa/train_data/test.csv
    llava15_vqav2:
      model: llava15
      dataset: vqav2
      input: artifacts/iclr_v2/llava15_vqav2/json/labels.jsonl
      fit_output: artifacts/iclr_v2/llava15_vqav2/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/llava15_vqav2/train_data/calibration.csv
      test_output: artifacts/iclr_v2/llava15_vqav2/train_data/test.csv
    internvl3_earthvqa:
      model: internvl3
      dataset: earthvqa
      input: artifacts/iclr_v2/internvl3_earthvqa/json/labels.jsonl
      fit_output: artifacts/iclr_v2/internvl3_earthvqa/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/internvl3_earthvqa/train_data/calibration.csv
      test_output: artifacts/iclr_v2/internvl3_earthvqa/train_data/test.csv
    internvl3_lingoqa:
      model: internvl3
      dataset: lingoqa
      input: artifacts/iclr_v2/internvl3_lingoqa/json/labels.jsonl
      fit_output: artifacts/iclr_v2/internvl3_lingoqa/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/internvl3_lingoqa/train_data/calibration.csv
      test_output: artifacts/iclr_v2/internvl3_lingoqa/train_data/test.csv
    internvl3_vqav2:
      model: internvl3
      dataset: vqav2
      input: artifacts/iclr_v2/internvl3_vqav2/json/labels.jsonl
      fit_output: artifacts/iclr_v2/internvl3_vqav2/train_data/fit.csv
      calibration_output: artifacts/iclr_v2/internvl3_vqav2/train_data/calibration.csv
      test_output: artifacts/iclr_v2/internvl3_vqav2/train_data/test.csv

detector:
  task: binary_significant_sdc
  group_column: semantic_group_id
  keep_all_feature_nan_in_training: true
  evaluation_slices:
    - full
    - finite
    - clean
    - injected_non_sdc
    - slight_sdc
    - significant_sdc
  random_state: 42
  calibration:
    strategy: maximize_f1
  xgboost:
    common:
      n_estimators: 10000
      max_depth: 6
      min_child_weight: 1.0
      subsample: 0.9
      colsample_bytree: 0.9
      early_stopping_rounds: 500
      test_ratio: 0.15
      random_state: 42
      n_jobs: 8
      device: cpu
      verbose: 200
    by_model:
      qwen25_vl:
        learning_rate: 0.01
      llava15:
        learning_rate: 0.01
      internvl3:
        learning_rate: 0.01

artifacts:
  root: artifacts
  overwrite: false
