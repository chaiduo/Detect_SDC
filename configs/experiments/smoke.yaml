schema_version: 2
name: qwen_earthvqa_smoke

models:
  qwen25_vl_smoke: configs/models/qwen25_vl_smoke.yaml

datasets:
  earthvqa_smoke: configs/datasets/earthvqa_smoke.yaml

matrix:
  - [qwen25_vl_smoke, earthvqa_smoke]

pipeline:
  stages:
    - profile
    - collect_mapping
    - train_mapping
    - inject
    - label
    - featurize
    - train_detector
    - report

execution:
  jobs:
    qwen25_vl_earthvqa_smoke:
      model: qwen25_vl_smoke
      dataset: earthvqa_smoke
      profile_output: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/json/profile.json
      mapping_data: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/json/mapping.jsonl
      mapping_model: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/model/mapping_model.pt
      injected_output: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/json/injection.jsonl
      labeled_output: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/json/labels.jsonl

labeling:
  model_path: /data01/cd_workspace/llm/prometheus-7b-v2.0
  max_new_tokens: 200
  identical_answer_policy: skip_and_mark_correct
  quality_scale: [0, 1, 2]
  significance_scale: [2, 1, 0]

features:
  last_k_steps: 2
  step_window: prefix
  statistics: [mean, max, min]
  metrics: [cos_sim, mean_diff, std_diff, l2_distance]
  finite_only: true
  layer_pairs:
    - [6, 7]
    - [22, 23]
    - [23, 24]
    - [24, 25]
    - [25, 26]
    - [26, 27]
  distance_pairs:
    - [6, 7]
    - [22, 23]
    - [23, 24]
    - [24, 25]
    - [25, 26]
    - [26, 27]

featurization:
  jobs:
    qwen25_vl_earthvqa_smoke:
      model: qwen25_vl_smoke
      dataset: earthvqa_smoke
      input: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/json/labels.jsonl
      fit_output: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/train_data/fit.csv
      calibration_output: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/train_data/calibration.csv
      test_output: artifacts/smoke_v2/qwen25_vl_earthvqa_smoke/train_data/test.csv

detector:
  task: binary_significant_sdc
  group_column: semantic_group_id
  keep_all_feature_nan_in_training: true
  evaluation_slices:
    - full
    - finite
    - clean
    - injected_non_sdc
    - slight_sdc
    - significant_sdc
  random_state: 42
  calibration:
    strategy: maximize_f1
  xgboost:
    common:
      n_estimators: 100
      max_depth: 3
      min_child_weight: 1.0
      subsample: 0.9
      colsample_bytree: 0.9
      early_stopping_rounds: 10
      test_ratio: 0.20
      random_state: 42
      n_jobs: 4
      device: cpu
      verbose: false
    by_model:
      qwen25_vl_smoke:
        learning_rate: 0.05

artifacts:
  root: artifacts/smoke_v2
  overwrite: false
