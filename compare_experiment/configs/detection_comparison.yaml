schema_version: 1

experiment:
  source_config: configs/experiments/current.yaml
  methods:
    - ranger_style
    - drdna_style
    - sieve

monitoring:
  layer_pairs:
    - [6, 7]
    - [22, 23]
    - [23, 24]
    - [24, 25]
    - [25, 26]
    - [26, 27]
  max_steps: 2

cohorts:
  calibration_ratio_within_train: 0.2
  split_seed: 42
  ranger_profile_fraction_of_fit: 0.2
  maximum_profile_samples: 1000

drdna:
  cohort_size: 64
  bins: 10
  strike_count: 3
  random_seed: 42
  lambda_individual: 1.0
  lambda_layer: 1.0
  lambda_extreme: 1.0

calibration:
  target_non_sdc_fpr: 0.01
  supplementary_fpr_budgets: [0.005, 0.01, 0.02, 0.05]

evaluation:
  include_all_significant_sdc: true
  maximum_sdc_per_model_dataset: 1000
  maximum_non_sdc_per_model_dataset: 1000
  bootstrap_replicates: 10000
  bootstrap_seed: 20260825
